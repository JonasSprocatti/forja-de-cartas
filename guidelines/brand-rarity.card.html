<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--ink); padding: 22px; }
  .row { display: flex; gap: 36px; align-items: center; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .gem { font-size: 34px; line-height: 1; }
  .lbl { font-family: var(--font-display); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--parch-dim); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><span class="gem" style="color:#2a2520">●</span><span class="lbl">Comum</span></div>
    <div class="item"><span class="gem" style="color:#7d8794">◆</span><span class="lbl">Incomum</span></div>
    <div class="item"><span class="gem" style="color:#b8973f">★</span><span class="lbl">Rara</span></div>
    <div class="item"><span class="gem" style="color:#c2501f">✦</span><span class="lbl">Mítica</span></div>
  </div>
</body>
</html>
