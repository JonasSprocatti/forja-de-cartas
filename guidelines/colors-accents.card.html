<!-- @dsCard group="Colors" viewport="700x180" name="Brass & accents" subtitle="Gold range, status and favourite accents" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--ink); font-family: var(--font-body); padding: 20px; }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .sw { border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
  .chip { height: 56px; }
  .meta { padding: 8px 10px; background: var(--ink-2); }
  .name { font-family: var(--font-display); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--parch); }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--parch-dim); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#f0d488"></div><div class="meta"><div class="name">Brass hi</div><div class="hex">#f0d488</div></div></div>
    <div class="sw"><div class="chip" style="background:#7a5e25"></div><div class="meta"><div class="name">Brass deep</div><div class="hex">#7a5e25</div></div></div>
    <div class="sw"><div class="chip" style="background:#bfe3c0"></div><div class="meta"><div class="name">Success</div><div class="hex">#bfe3c0</div></div></div>
    <div class="sw"><div class="chip" style="background:#f4c9b8"></div><div class="meta"><div class="name">Danger</div><div class="hex">#f4c9b8</div></div></div>
    <div class="sw"><div class="chip" style="background:#e98aa6"></div><div class="meta"><div class="name">Like</div><div class="hex">#e98aa6</div></div></div>
    <div class="sw"><div class="chip" style="background:linear-gradient(180deg,#f0d488,#c9a14a)"></div><div class="meta"><div class="name">Gold grad</div><div class="hex">button fill</div></div></div>
  </div>
</body>
</html>
