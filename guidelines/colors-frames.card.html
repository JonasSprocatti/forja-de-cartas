<!-- @dsCard group="Colors" viewport="700x150" name="Card frame identities" subtitle="The frame gradient per colour identity" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--ink); font-family: var(--font-body); padding: 20px; }
  .row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  .frame { height: 70px; border-radius: 8px; box-shadow: inset 0 0 0 2px rgba(0,0,0,.4), inset 0 2px 1px rgba(255,255,255,.25); }
  .lbl { font-family: var(--font-display); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--parch-dim); text-align: center; margin-top: 6px; }
</style>
</head>
<body>
  <div class="row">
    <div><div class="frame" style="background:linear-gradient(180deg,#efe7cf,#c7ba92)"></div><div class="lbl">White</div></div>
    <div><div class="frame" style="background:linear-gradient(180deg,#5a97c9,#235080)"></div><div class="lbl">Blue</div></div>
    <div><div class="frame" style="background:linear-gradient(180deg,#3f3b34,#161310)"></div><div class="lbl">Black</div></div>
    <div><div class="frame" style="background:linear-gradient(180deg,#d4794f,#943219)"></div><div class="lbl">Red</div></div>
    <div><div class="frame" style="background:linear-gradient(180deg,#6fa869,#316631)"></div><div class="lbl">Green</div></div>
    <div><div class="frame" style="background:linear-gradient(180deg,#dcc46b,#a8862f)"></div><div class="lbl">Multi</div></div>
    <div><div class="frame" style="background:linear-gradient(180deg,#bdb5a4,#827a68)"></div><div class="lbl">Artifact</div></div>
  </div>
</body>
</html>
