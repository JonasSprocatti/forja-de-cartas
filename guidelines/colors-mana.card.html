<!-- @dsCard group="Colors" viewport="700x170" name="Mana identity (WUBRG)" subtitle="The five colours, generic and special pips" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--ink); font-family: var(--font-body); padding: 22px; }
  .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .lbl { font-family: var(--font-display); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--parch-dim); }
  .div { width: 1px; height: 40px; background: var(--line); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><span class="fdc-pip fdc-pip--W fdc-pip--lg">W</span><span class="lbl">White</span></div>
    <div class="item"><span class="fdc-pip fdc-pip--U fdc-pip--lg">U</span><span class="lbl">Blue</span></div>
    <div class="item"><span class="fdc-pip fdc-pip--B fdc-pip--lg">B</span><span class="lbl">Black</span></div>
    <div class="item"><span class="fdc-pip fdc-pip--R fdc-pip--lg">R</span><span class="lbl">Red</span></div>
    <div class="item"><span class="fdc-pip fdc-pip--G fdc-pip--lg">G</span><span class="lbl">Green</span></div>
    <div class="div"></div>
    <div class="item"><span class="fdc-pip fdc-pip--C fdc-pip--lg">3</span><span class="lbl">Generic</span></div>
    <div class="item"><span class="fdc-pip fdc-pip--X fdc-pip--lg">X</span><span class="lbl">Variable</span></div>
    <div class="div"></div>
    <div class="item"><span class="fdc-pip fdc-pip--T fdc-pip--lg">↷</span><span class="lbl">Tap</span></div>
    <div class="item"><span class="fdc-pip fdc-pip--E fdc-pip--lg">⚡</span><span class="lbl">Energy</span></div>
    <div class="item"><span class="fdc-pip fdc-pip--P fdc-pip--lg">Φ</span><span class="lbl">Phyrexian</span></div>
  </div>
</body>
</html>
