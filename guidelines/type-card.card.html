<!-- @dsCard group="Type" viewport="700x200" name="Card voice — Spectral & Bitter" subtitle="Rules text, flavour and numerals" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--ink); padding: 22px; }
  .box { background: #f5edd3; border-radius: 8px; padding: 14px 16px; max-width: 560px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }
  .rules { font-family: var(--font-rules); font-size: 15px; color: #1a150d; line-height: 1.32; }
  .flavor { font-family: var(--font-rules); font-style: italic; font-size: 14px; color: #463c2a; margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(0,0,0,.12); }
  .pt { display: inline-block; margin-top: 12px; font-family: var(--font-numeral); font-weight: 800; font-size: 20px; color: #1c160c; background: #ecdb9c; padding: 3px 14px; border-radius: 7px; box-shadow: var(--bevel); }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--parch-dim); margin-top: 12px; }
</style>
</head>
<body>
  <div class="box">
    <div class="rules">Voar <i>(Esta criatura só pode ser bloqueada por criaturas com voar ou alcance.)</i></div>
    <div class="flavor">"A névoa não esconde. Ela escolhe o que mostrar."</div>
  </div>
  <span class="pt">3/4</span>
  <div class="meta">Spectral — rules & flavour · Bitter 800 — power/toughness numerals</div>
</body>
</html>
