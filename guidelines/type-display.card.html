<!-- @dsCard group="Type" viewport="700x200" name="Display — Cinzel" subtitle="Engraved headings, labels & buttons" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--ink); padding: 22px; }
  .h1 { font-family: var(--font-display); font-weight: 700; font-size: 38px; letter-spacing: .06em; color: var(--brass-hi); line-height: 1.1; }
  .h2 { font-family: var(--font-display); font-weight: 600; font-size: 22px; letter-spacing: .05em; color: var(--parch); margin-top: 10px; }
  .lbl { font-family: var(--font-display); font-weight: 600; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--brass); margin-top: 14px; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--parch-dim); margin-top: 4px; }
</style>
</head>
<body>
  <div class="h1">Forja de Cartas</div>
  <div class="h2">Crie sua própria lenda</div>
  <div class="lbl">Nome da carta · field label</div>
  <div class="meta">Cinzel — 700 / 600 · tracking .06–.12em · UPPERCASE labels</div>
</body>
</html>
