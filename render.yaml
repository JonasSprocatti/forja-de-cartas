# Blueprint do Render — cria o Web Service automaticamente.
# As variáveis ficam com sync:false (você preenche os valores no painel do Render).
services:
  - type: web
    name: forja-de-cartas
    runtime: node
    plan: free                 # troque para "starter" se quiser sempre ligado (sem cold start)
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_IMAGE_MODEL
        value: gemini-2.5-flash-image
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_MODE
        value: subscription
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
