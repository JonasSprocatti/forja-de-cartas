<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Forja de Cartas</title>
<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="forge.css" />
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>

  <script type="text/babel" src="CardBackground.jsx" data-presets="react"></script>
  <script type="text/babel" src="Header.jsx" data-presets="react"></script>
  <script type="text/babel" src="Landing.jsx" data-presets="react"></script>
  <script type="text/babel" src="ForgeEditor.jsx" data-presets="react"></script>
  <script type="text/babel" src="Gallery.jsx" data-presets="react"></script>

  <script type="text/babel" data-presets="react">
    const { Toast } = window.ForjaDeCartasDesignSystem_e2faf4;

    function Guide() {
      return (
        <div className="fk-guide">
          <h2>Como funciona a forja</h2>
          <p>Toda carta nasce de uma ideia. Aqui você dá forma a ela em três passos —
          e pode parar, salvar e voltar quando quiser.</p>
          <h3>1 · Escolha o caminho</h3>
          <p>Preencha os campos você mesmo ou descreva a carta em uma frase e deixe a IA
          montar o primeiro rascunho. Os dois caminhos levam ao mesmo editor.</p>
          <h3>2 · Ajuste a moldura</h3>
          <p>O custo de mana define a cor automaticamente — duas cores viram a moldura
          dourada de multicolor. Escolha a raridade e, se quiser, ligue o acabamento foil.</p>
          <h3>3 · Forje e compartilhe</h3>
          <p>Baixe a carta como PNG em alta resolução ou publique na coleção para a
          comunidade remixar.</p>
        </div>
      );
    }

    function App() {
      const [route, setRoute] = React.useState("home");
      const [toasts, setToasts] = React.useState([]);
      const pushToast = (t) => {
        const id = Math.random();
        setToasts((ts) => [...ts, { ...t, id }]);
        setTimeout(() => setToasts((ts) => ts.filter((x) => x.id !== id)), 2600);
      };
      const go = (r) => { setRoute(r); window.scrollTo({ top: 0 }); };

      return (
        <>
          <CardBackground density={route === "home" ? "full" : "light"} />
          <div className="fk-app">
            <Header route={route} onNavigate={go} onNew={() => go("editor")} />
            {route === "home" && (
              <Landing onStart={() => go("editor")} onExplore={() => go("gallery")} />
            )}
            {route === "editor" && <ForgeEditor onToast={pushToast} />}
            {route === "gallery" && <Gallery onOpen={() => go("editor")} />}
            {route === "guide" && <Guide />}
          </div>
          <div className="fk-toast-host">
            {toasts.map((t) => (
              <div key={t.id} className="fk-toast-enter">
                <Toast type={t.type}>{t.msg}</Toast>
              </div>
            ))}
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
